<!DOCTYPE html>
<html lang="ca">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulari</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Inscripció al festival</h1>
    <form action="pas1-resultat.php" method="get">
        <label for="nom">Nom</label>
        <input id="nom" name="nom" autocomplete="name" required>

        <label for="correu">Correu electrònic</label>
        <input id="correu" name="correu" type="email" autocomplete="email" required>

        <label for="dia">Dia</label>
        <select id="dia" name="dia">
            <option value="divendres">Divendres</option>
            <option value="dissabte">Dissabte</option>
        </select>

        <button type="submit">Enviar</button>
    </form>
</body>

</html>
